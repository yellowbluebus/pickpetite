<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PickPetite</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    body {
      background-color: #FAF9F6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .logo {
      width: 64px;
      height: 64px;
      opacity: 0;
      animation: pulse 1.5s infinite ease-in-out, fadeIn 0.3s ease-out forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <img src="/images/logo.png" alt="PickPetite" class="logo">

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const asin = urlParams.get('a');
      const source = urlParams.get('s') || 'direct';
      
      if (!asin) {
        window.location.href = '/app/';
        return;
      }

      const tagMap = {
        'tk': 'pickpetite-tk-20',
        'ig': 'pickpetite-ig-20',
        'fb': 'pickpetite-fb-20',
        'yt': 'pickpetite-yt-20',
        'direct': 'pickpetite-20'
      };
      const tag = tagMap[source] || tagMap['direct'];

      // Web App URL - Using root with params for best reliability
      const webUrl = `https://pickpetite.com/app/?id=${asin}&tag=${tag}`;

      // Detection
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      
      if (isMobile) {
        const appUrl = `pickpetite://product-detail?id=${asin}&tag=${tag}`;
        
        // Attempt to open native app
        window.location.href = appUrl;

        // Fallback to web app
        setTimeout(function() {
          window.location.replace(webUrl);
        }, 800);
      } else {
        // Direct to web on desktop
        window.location.replace(webUrl);
      }
    })();
  </script>
</body>
</html>
